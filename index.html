<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>SPACE STICKMAN ACTION RUN</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f0ff;
            --neon-pink: #ff0055;
            --neon-green: #00ff88;
            --neon-yellow: #ffee00;
            --ui-bg: rgba(12, 16, 28, 0.9);
            --ui-border: rgba(0, 240, 255, 0.5);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Orbitron', 'Noto Sans KR', sans-serif;
        }

        body {
            background: #030509;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 920px;
            max-height: 440px;
            background: #060913;
            border-radius: 12px;
            border: 2px solid var(--ui-border);
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.25), inset 0 0 20px rgba(0, 0, 0, 0.9);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #060913;
        }

        /* --- UI Layer --- */
        #ui-layer {
            position: absolute;
            top: 12px;
            right: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--ui-bg);
            padding: 8px 15px;
            border-radius: 25px;
            border: 1px solid var(--ui-border);
            backdrop-filter: blur(10px);
            z-index: 5;
        }

        /* 최종보스 체력바 */
        #boss-ui-container {
            position: absolute;
            top: 12px;
            left: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--ui-bg);
            padding: 8px 15px;
            border-radius: 25px;
            border: 1px solid var(--neon-pink);
            backdrop-filter: blur(10px);
            z-index: 5;
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.6s ease, transform 0.6s ease;
            pointer-events: none;
        }
        #boss-ui-container.visible {
            opacity: 1;
            transform: translateY(0);
        }
        #boss-hp-title {
            font-size: 12px;
            font-weight: 800;
            color: var(--neon-pink);
        }
        #boss-hp-bar-container {
            width: 140px;
            height: 14px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 7px;
            padding: 2px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        #boss-hp-bar {
            width: 100%;
            height: 100%;
            background: var(--neon-green);
            border-radius: 4px;
            transition: width 0.4s cubic-bezier(0.1, 1, 0.1, 1), background-color 0.3s;
        }
        #boss-hp-text {
            font-size: 11px;
            font-weight: 800;
            color: #fff;
            min-width: 65px;
            text-align: right;
        }

        #star-counter {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-right: 5px;
            font-size: 12px;
            font-weight: 900;
            color: var(--neon-yellow);
            text-shadow: 0 0 8px var(--neon-yellow);
            border-right: 1px solid rgba(255,255,255,0.2);
            padding-right: 10px;
        }

        #coin-counter {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-right: 5px;
            font-size: 12px;
            font-weight: 900;
            color: #ffcc00;
            text-shadow: 0 0 6px rgba(255, 204, 0, 0.6);
            border-right: 1px solid rgba(255,255,255,0.2);
            padding-right: 10px;
        }

        #hp-title {
            font-size: 12px;
            font-weight: 800;
            color: var(--neon-blue);
        }

        #hp-bar-container {
            width: 120px;
            height: 14px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 7px;
            padding: 2px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        #hp-bar {
            width: 100%;
            height: 100%;
            background: var(--neon-green);
            border-radius: 4px;
            box-shadow: 0 0 10px var(--neon-green);
            transition: width 0.2s ease-out;
        }

        #hp-text {
            font-size: 11px;
            font-weight: 800;
            color: #fff;
            min-width: 45px;
            text-align: right;
        }

        #charge-container {
            position: absolute;
            bottom: 95px;
            right: 25px;
            pointer-events: none;
            z-index: 5;
        }

        #charge-text {
            font-size: 13px;
            font-weight: 900;
            color: var(--neon-pink);
            text-shadow: 0 0 8px var(--neon-pink);
            height: 16px;
        }

        /* --- Controls --- */
        #controls {
            position: absolute;
            bottom: 12px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: none;
            z-index: 5;
        }

        .btn-group {
            display: flex;
            align-items: center;
            gap: 15px;
            pointer-events: auto;
        }

        .control-btn {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--ui-bg);
            border: 1.5px solid var(--ui-border);
            backdrop-filter: blur(10px);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            touch-action: none;
        }

        .control-btn:active {
            transform: scale(0.92);
        }

        .btn-label {
            font-size: 9px;
            margin-top: 1px;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.8);
        }

        #btn-move-pad {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            border-color: rgba(0, 240, 255, 0.7);
            background: radial-gradient(circle, rgba(0,240,255,0.2) 0%, rgba(12,16,28,0.9) 80%);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #joystick-knob {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at 30% 30%, #00f0ff 0%, #0077aa 100%);
            border-radius: 50%;
            border: 1.5px solid #ffffff;
            box-shadow: 0 4px 10px rgba(0, 240, 255, 0.6);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            transition: transform 0.05s ease-out;
        }

        #btn-attack {
            width: 65px;
            height: 65px;
            border-radius: 16px;
            border-color: rgba(255, 0, 85, 0.5);
            background: radial-gradient(circle, rgba(255,0,85,0.3) 0%, rgba(12,16,28,0.7) 70%);
            box-shadow: 0 0 12px rgba(255, 0, 85, 0.3);
        }
        #btn-attack.charging {
            border-color: var(--neon-pink);
            box-shadow: 0 0 25px var(--neon-pink);
            background: rgba(255, 0, 85, 0.5);
        }

        /* --- 캐릭터 뽑기 버튼 강조 효과 --- */
        #gacha-btn {
            position: absolute;
            top: 12px;
            left: 15px;
            background: linear-gradient(135deg, #ff0055, #7928ca);
            border: 2.5px solid #ffee00;
            color: #fff;
            padding: 8px 16px;
            border-radius: 22px;
            font-size: 12px;
            font-weight: 900;
            cursor: pointer;
            display: none;
            z-index: 6;
            box-shadow: 0 0 20px rgba(255, 238, 0, 0.8), inset 0 0 10px rgba(255, 255, 255, 0.5);
            animation: pulseGachaButton 1.2s infinite alternate ease-in-out;
        }

        @keyframes pulseGachaButton {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(255,238,0,0.6), inset 0 0 8px rgba(255,255,255,0.4); }
            100% { transform: scale(1.08); box-shadow: 0 0 30px rgba(255,238,0,1), inset 0 0 15px rgba(255,255,255,0.8); }
        }

        .gacha-badge {
            position: absolute;
            top: -10px;
            right: -8px;
            background: #ff0055;
            color: #fff;
            font-size: 9px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 10px;
            border: 1px solid #fff;
            box-shadow: 0 0 8px #ff0055;
            animation: bounceBadge 0.8s infinite alternate;
        }
        @keyframes bounceBadge {
            0% { transform: translateY(0); }
            100% { transform: translateY(-3px); }
        }

        /* --- 뽑기 카드 선택 화면 오버레이 --- */
        #gacha-screen {
            position: absolute;
            inset: 0;
            background: rgba(3, 5, 12, 0.95);
            backdrop-filter: blur(15px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        .gacha-title {
            font-size: 24px;
            font-weight: 900;
            color: #00f0ff;
            margin-bottom: 25px;
            text-shadow: 0 0 15px #00f0ff;
        }
        .cards-container {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }
        .gacha-card {
            width: 120px;
            height: 175px;
            background: linear-gradient(145deg, #1a2238, #0d121f);
            border: 2px solid rgba(0, 240, 255, 0.4);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            padding: 10px;
            text-align: center;
        }
        .gacha-card:hover {
            transform: translateY(-8px);
            border-color: #00f0ff;
            box-shadow: 0 12px 30px rgba(0,240,255,0.4);
        }
        .card-back-text {
            font-size: 28px;
            font-weight: 900;
            color: #00f0ff;
            text-shadow: 0 0 10px #00f0ff;
        }

        /* --- Screens --- */
        .screen-overlay {
            position: absolute;
            inset: 0;
            background: rgba(5, 7, 12, 0.92);
            backdrop-filter: blur(15px);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .screen-title {
            font-size: 30px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px currentColor;
            text-align: center;
        }

        .screen-sub {
            font-size: 14px;
            color: #00f0ff;
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: 1px;
        }

        .action-btn {
            padding: 12px 35px;
            font-size: 15px;
            font-weight: 800;
            color: #fff;
            background: transparent;
            border: 2px solid var(--neon-blue);
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            transition: all 0.2s;
        }
        .action-btn:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 25px var(--neon-blue);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="920" height="440"></canvas>
    
    <button id="gacha-btn">
        ✨ 캐릭터 뽑기
        <span class="gacha-badge">뽑기 가능!</span>
    </button>

    <div id="boss-ui-container">
        <span id="boss-hp-title">BOSS HP</span>
        <div id="boss-hp-bar-container">
            <div id="boss-hp-bar"></div>
        </div>
        <span id="boss-hp-text">100 / 100</span>
    </div>

    <div id="ui-layer" style="display:none;">
        <div id="star-counter">★ <span id="star-count-num">0</span>/3</div>
        <div id="coin-counter">🪙 x <span id="coin-count-num">0</span></div>
        <span id="hp-title">HP</span>
        <div id="hp-bar-container">
            <div id="hp-bar"></div>
        </div>
        <span id="hp-text">20 / 20</span>
    </div>

    <div id="charge-container">
        <div id="charge-text"></div>
    </div>

    <div id="controls" style="display:none;">
        <div class="btn-group">
            <div id="btn-move-pad" class="control-btn">
                <div id="joystick-knob"></div>
            </div>
        </div>
        <div class="btn-group">
            <div id="btn-attack" class="control-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="#ff0055"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
                <span class="btn-label" style="color: rgba(255,0,85,0.9);">ATTACK</span>
            </div>
        </div>
    </div>

    <!-- 뽑기 카드 선택 화면 오버레이 -->
    <div id="gacha-screen">
        <div class="gacha-title">✨ 미스터리 카드 조합 시스템 ✨</div>
        <div class="cards-container" id="cards-wrapper"></div>
        <button id="gacha-close-btn" class="action-btn" style="display:none;">게임으로 돌아가기</button>
    </div>

    <div id="start-screen" class="screen-overlay">
        <h1 class="screen-title" style="color: var(--neon-blue);">SPACE STICKMAN ACTION</h1>
        <div class="screen-sub">Made by 김도하</div>
        <button id="start-btn" class="action-btn">START GAME</button>
    </div>

    <div id="game-over-screen" class="screen-overlay" style="display: none;">
        <h1 id="game-msg" class="screen-title">GAME OVER</h1>
        <div id="game-sub" class="screen-sub" style="display:none;"></div>
        <button id="restart-btn" class="action-btn" onclick="resetGame()">RETRY</button>
    </div>
</div>

<script>
window.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('gameCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    const uiLayer = document.getElementById('ui-layer');
    const controls = document.getElementById('controls');
    const hpBar = document.getElementById('hp-bar');
    const hpText = document.getElementById('hp-text');
    const starCountNum = document.getElementById('star-count-num');
    const coinCountNum = document.getElementById('coin-count-num');
    const chargeText = document.getElementById('charge-text');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const gameOverScreen = document.getElementById('game-over-screen');
    const gameMsg = document.getElementById('game-msg');
    const gameSub = document.getElementById('game-sub');
    const joystickKnob = document.getElementById('joystick-knob');
    
    const gachaBtn = document.getElementById('gacha-btn');
    const gachaScreen = document.getElementById('gacha-screen');
    const cardsWrapper = document.getElementById('cards-wrapper');
    const gachaCloseBtn = document.getElementById('gacha-close-btn');
    const bossUiContainer = document.getElementById('boss-ui-container');
    const bossHpBar = document.getElementById('boss-hp-bar');
    const bossHpText = document.getElementById('boss-hp-text');

    const GROUND_Y = 320;
    const STAGE_MAX_X = 6000;

    let gameStarted = false;
    let isGameOver = false;
    let animFrame = 0;
    let cameraX = 0;

    let playerCoins = 0;

    // 캐릭터 조합 데이터 구조 정의 (수정 2 요구사항 반영)
    class CardType {
        constructor(name, colorHex, probability, isRainbow = false) {
            this.name = name;
            this.colorHex = colorHex;
            this.probability = probability;
            this.isRainbow = isRainbow;
        }
    }

    const cardTypes = [
        new CardType('무지개', 'rainbow', 0.05, true),
        new CardType('빨강', '#ff0000', 0.086),
        new CardType('주황', '#ff7700', 0.086),
        new CardType('노랑', '#ffee00', 0.086),
        new CardType('초록', '#00ff88', 0.086),
        new CardType('파랑', '#00f0ff', 0.086),
        new CardType('남색', '#0044ff', 0.086),
        new CardType('보라', '#9900ff', 0.086),
        new CardType('갈색', '#8b4513', 0.086),
        new CardType('분홍', '#ff69b4', 0.086),
        new CardType('흰색', '#ffffff', 0.086),
        new CardType('검정', '#222222', 0.086)
    ];

    // 현재 장착된 플레이어 커스텀 캐릭터 프로필
    let activeCharacter = {
        name: '기본 스틱맨',
        grade: '일반',
        colorHex: '#00f0ff',
        weapon: '총',
        attackType: '일반 총알',
        effect: '기본',
        aura: '없음',
        accessory: '없음',
        isRainbow: false
    };

    const weaponsList = ['검', '창', '도끼', '망치', '활', '레이저총'];
    const attackTypesList = ['일반 총알', '별 발사', '화살 발사', '불꽃 발사', '얼음탄 발사', '번개 공격', '검기', '독구름'];
    const aurasList = ['불꽃 오라', '번개 오라', '얼음 오라', '독 연기 효과', '무지개 오라'];
    const accessoriesList = ['망토', '악마 뿔', '천사 후광', '작은 날개', '왕관', '투구', '선글라스', '사이보그 팔'];

    function generateRandomCharacter(cardData) {
        if (cardData.isRainbow) {
            return {
                name: '🌈 천사악마 전설 영웅',
                grade: 'Legendary',
                colorHex: 'rainbow',
                weapon: '전용 검',
                attackType: '검기 발사',
                effect: '무지개 폭발',
                aura: '화려한 무지개 오라',
                accessory: '천사/악마 혼합 날개',
                isRainbow: true
            };
        } else {
            const randW = weaponsList[Math.floor(Math.random() * weaponsList.length)];
            const randA = attackTypesList[Math.floor(Math.random() * attackTypesList.length)];
            const randAu = aurasList[Math.floor(Math.random() * aurasList.length)];
            const randAc = accessoriesList[Math.floor(Math.random() * accessoriesList.length)];

            return {
                name: `${cardData.name} 특수 용사`,
                grade: 'Rare',
                colorHex: cardData.colorHex,
                weapon: randW,
                attackType: randA,
                effect: '스타일 이펙트',
                aura: randAu,
                accessory: randAc,
                isRainbow: false
            };
        }
    }

    let collectedStars = 0;
    let damageMultiplier = 1.0;
    let scaleMultiplier = 1.0;
    let fallingStars = [];
    let starSpawnTimer = 0;
    let floatingTexts = [];

    const stars = Array.from({ length: 90 }, () => ({
        x: Math.random() * 6500,
        y: Math.random() * 300,
        size: Math.random() * 2 + 0.5,
        speed: 0.35
    }));

    const player = {
        x: 100,
        y: GROUND_Y - 60,
        width: 28,
        height: 60,
        vy: 0,
        hitsTaken: 0,
        maxHits: 20,
        isGrounded: false,
        isCrouching: false,
        isAimingUp: false,
        isAttacking: false,
        attackAnimTimer: 0
    };

    let projectiles = [];
    let enemyProjectiles = [];
    let explosions = [];
    let attackHoldTimer = null;
    let continuousFireTimer = null;
    let attackStartTime = 0;

    let enemies = [];
    let obstacles = [];
    let flyingEnemies = [];
    let flyingMinionSpawned = false;
    let minionSpawnTimer = 0;

    const keys = { left: false, right: false, down: false, up: false };

    startBtn.addEventListener('click', () => {
        startScreen.style.display = 'none';
        uiLayer.style.display = 'flex';
        controls.style.display = 'flex';
        gameStarted = true;
        buildStageMap();
        requestAnimationFrame(update);
    });

    function addCoins(amount) {
        playerCoins += amount;
        coinCountNum.innerText = playerCoins;
        if (playerCoins >= 10) {
            gachaBtn.style.display = 'block';
        }
    }

    gachaBtn.addEventListener('click', () => {
        if (playerCoins < 10 || isGameOver) return;
        addCoins(-10);
        if (playerCoins < 10) {
            gachaBtn.style.display = 'none';
        }
        openGachaModal();
    });

    function openGachaModal() {
        gachaScreen.style.display = 'flex';
        cardsWrapper.innerHTML = '';
        gachaCloseBtn.style.display = 'none';

        let chosenCards = [];
        for (let i = 0; i < 3; i++) {
            chosenCards.push(getRandomCardType());
        }

        chosenCards.forEach((cardType, index) => {
            let cardEl = document.createElement('div');
            cardEl.className = 'gacha-card';
            cardEl.innerHTML = `<div class="card-back-text">?</div>`;
            
            cardEl.addEventListener('click', () => {
                revealCards(chosenCards, index);
            }, { once: true });

            cardsWrapper.appendChild(cardEl);
        });
    }

    function getRandomCardType() {
        let rand = Math.random();
        let cumulative = 0;
        for (let card of cardTypes) {
            cumulative += card.probability;
            if (rand <= cumulative) {
                return card;
            }
        }
        return cardTypes[1];
    }

    function revealCards(chosenCards, selectedIndex) {
        const cardElements = cardsWrapper.children;
        
        for (let i = 0; i < cardElements.length; i++) {
            let cardData = chosenCards[i];
            let el = cardElements[i];
            let generatedChar = generateRandomCharacter(cardData);
            
            el.style.background = cardData.isRainbow 
                ? 'linear-gradient(135deg, red, orange, yellow, green, blue, indigo, violet)' 
                : cardData.colorHex;
            el.style.color = (cardData.colorHex === '#ffffff' || cardData.isRainbow) ? '#000' : '#fff';
            
            el.innerHTML = `
                <div style="font-weight:900; font-size:11px; margin-bottom:4px;">${generatedChar.name}</div>
                <div style="font-size:9px; opacity:0.9; line-height:1.2;">
                    무기: ${generatedChar.weapon}<br>
                    공격: ${generatedChar.attackType}<br>
                    오라: ${generatedChar.aura}<br>
                    장식: ${generatedChar.accessory}
                </div>
            `;

            if (i === selectedIndex) {
                activeCharacter = generatedChar;
                el.style.border = '3px solid #ffffff';
                el.style.transform = 'scale(1.08)';
            } else {
                el.style.opacity = '0.5';
            }
        }

        gachaCloseBtn.style.display = 'block';
    }

    gachaCloseBtn.addEventListener('click', () => {
        gachaScreen.style.display = 'none';
    });

    function spawnDamageText(x, y, damageVal) {
        floatingTexts.push({
            x: x,
            y: y,
            text: `-${damageVal}`,
            alpha: 1.0,
            vy: -1.2
        });
    }

    function updateAndDrawFloatingTexts() {
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            let ft = floatingTexts[i];
            ft.y += ft.vy;
            ft.alpha -= 0.03;

            if (ft.alpha <= 0) {
                floatingTexts.splice(i, 1);
                continue;
            }

            ctx.save();
            ctx.globalAlpha = ft.alpha;
            ctx.font = 'bold 16px Orbitron';
            ctx.fillStyle = '#ff0055';
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#ff0055';
            ctx.fillText(ft.text, ft.x, ft.y);
            ctx.restore();
        }
    }

    function buildStageMap() {
        const mapLayout = [
            { pos: 400, type: 'single' },
            { pos: 600, type: 'minions' },
            { pos: 900, type: 'giant_wall' },
            { pos: 1250, type: 'minions' },
            { pos: 1550, type: 'single' },
            { pos: 1800, type: 'giant_wall' },
            { pos: 2200, type: 'minions' },
            { pos: 2550, type: 'single' },
            { pos: 2800, type: 'mid_boss' },
            { pos: 3100, type: 'giant_wall' },
            { pos: 3500, type: 'minions' },
            { pos: 4000, type: 'single' },
            { pos: 4500, type: 'giant_wall' },
            { pos: 5000, type: 'minions' },
            { pos: 5700, type: 'boss' }
        ];

        mapLayout.forEach(item => {
            if (item.type === 'single') {
                obstacles.push({ x: item.pos, y: GROUND_Y - 50, width: 50, height: 50, type: Math.random() < 0.5 ? 'black' : 'white', hp: 1 });
            } else if (item.type === 'giant_wall') {
                obstacles.push({ x: item.pos, y: GROUND_Y - 50, width: 50, height: 50, type: 'black', hp: Infinity });
                obstacles.push({ x: item.pos, y: GROUND_Y - 100, width: 50, height: 50, type: 'white', hp: 1 });
                obstacles.push({ x: item.pos, y: GROUND_Y - 150, width: 50, height: 50, type: 'white', hp: 1 });
                obstacles.push({ x: item.pos + 50, y: GROUND_Y - 50, width: 50, height: 50, type: 'black', hp: Infinity });
                obstacles.push({ x: item.pos + 50, y: GROUND_Y - 100, width: 50, height: 50, type: 'white', hp: 1 });
                obstacles.push({ x: item.pos + 100, y: GROUND_Y - 50, width: 50, height: 50, type: 'black', hp: Infinity });
            } else if (item.type === 'minions') {
                enemies.push({ x: item.pos, y: GROUND_Y - 52, width: 48, height: 52, hp: 10, maxHp: 10, isBoss: false, isMidBoss: false, lastAttack: 0 });
                enemies.push({ x: item.pos + 70, y: GROUND_Y - 52, width: 48, height: 52, hp: 10, maxHp: 10, isBoss: false, isMidBoss: false, lastAttack: 0 });
                enemies.push({ x: item.pos + 140, y: GROUND_Y - 52, width: 48, height: 52, hp: 10, maxHp: 10, isBoss: false, isMidBoss: false, lastAttack: 0 });
            } else if (item.type === 'mid_boss') {
                enemies.push({ x: item.pos, y: GROUND_Y - 68, width: 62, height: 68, hp: 30, maxHp: 30, isBoss: false, isMidBoss: true, lastAttack: 0, angleOffset: 0, hitFlashTimer: 0 });
            } else if (item.type === 'boss') {
                enemies.push({ x: item.pos, y: GROUND_Y - 156, width: 144, height: 156, hp: 100, maxHp: 100, isBoss: true, isMidBoss: false, lastAttack: 0, patternCount: 0, hitFlashTimer: 0 });
            }
        });
    }

    function update() {
        if (!gameStarted || isGameOver) return;
        animFrame++;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        cameraX = player.x - 250;
        if (cameraX < 0) cameraX = 0;

        ctx.save();
        ctx.translate(-cameraX, 0);

        drawSpaceBackground();

        minionSpawnTimer++;
        if (minionSpawnTimer > 180 && enemies.length < 15) {
            minionSpawnTimer = 0;
            let spawnX = player.x + 800 + Math.random() * 200;
            if (spawnX < STAGE_MAX_X - 400) {
                enemies.push({
                    x: spawnX,
                    y: GROUND_Y - 52,
                    width: 48,
                    height: 52,
                    hp: 10,
                    maxHp: 10,
                    isBoss: false,
                    isMidBoss: false,
                    lastAttack: 0
                });
            }
        }

        if (damageMultiplier < 4.0) {
            starSpawnTimer++;
            if (starSpawnTimer > 240) {
                starSpawnTimer = 0;
                fallingStars.push({
                    x: cameraX + 100 + Math.random() * 750,
                    y: -20,
                    vy: 2.2,
                    radius: 12,
                    alpha: 1.0
                });
            }
        }

        for (let i = fallingStars.length - 1; i >= 0; i--) {
            let fs = fallingStars[i];
            fs.y += fs.vy;

            ctx.save();
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ffee00';
            ctx.fillStyle = '#ffee00';
            ctx.beginPath();
            ctx.arc(fs.x, fs.y, fs.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(fs.x, fs.y, fs.radius * 0.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            let pBox = { x: player.x, y: player.y, width: player.width, height: player.height };
            let starBox = { x: fs.x - fs.radius, y: fs.y - fs.radius, width: fs.radius * 2, height: fs.radius * 2 };
            if (isBoxColliding(pBox, starBox)) {
                if (collectedStars < 3) {
                    collectedStars++;
                    damageMultiplier *= 2.0; 
                    scaleMultiplier += 0.4;  
                }
                starCountNum.innerText = collectedStars;
                createExplosion(fs.x, fs.y, '#ffee00');
                fallingStars.splice(i, 1);
                continue;
            }

            if (fs.y > GROUND_Y + 20) {
                fallingStars.splice(i, 1);
            }
        }

        if (player.x >= STAGE_MAX_X * 0.3 && !flyingMinionSpawned) {
            flyingMinionSpawned = true;
            for (let i = 0; i < 3; i++) {
                flyingEnemies.push({
                    x: player.x + 500 + i * 300,
                    y: 100 + Math.random() * 60,
                    width: 40,
                    height: 30,
                    hp: 5,
                    lastAttack: 0,
                    dir: -1
                });
            }
        }

        let nextX = player.x;
        if (keys.left) nextX -= 4;
        if (keys.right) nextX += 4;
        nextX = Math.max(10, nextX);

        let canMoveX = true;
        const testPlayerBox = { x: nextX, y: player.y, width: player.width, height: player.height };
        for (let obs of obstacles) {
            if (isBoxColliding(testPlayerBox, obs)) {
                if (player.y + player.height > obs.y + 4) {
                    canMoveX = false;
                    break;
                }
            }
        }
        if (canMoveX) player.x = nextX;

        player.vy += 0.8;
        player.y += player.vy;

        if (player.y >= GROUND_Y - player.height) {
            player.y = GROUND_Y - player.height;
            player.vy = 0;
            player.isGrounded = true;
        }

        for (let obs of obstacles) {
            if (player.x + player.width > obs.x && player.x < obs.x + obs.width) {
                if (player.vy > 0 && player.y + player.height >= obs.y && player.y + player.height - player.vy <= obs.y + 12) {
                    player.y = obs.y - player.height;
                    player.vy = 0;
                    player.isGrounded = true;
                }
            }
        }

        if (player.isAttacking) {
            player.attackAnimTimer--;
            if (player.attackAnimTimer <= 0) player.isAttacking = false;
        }

        drawHero(player.x, player.y, player.isCrouching, player.isAimingUp, player.isAttacking, animFrame, activeCharacter);

        for (let i = projectiles.length - 1; i >= 0; i--) {
            let p = projectiles[i];
            p.x += p.vx;
            p.y += p.vy;
            
            ctx.save();
            ctx.shadowBlur = 15 * p.scale;
            ctx.shadowColor = p.color || '#00f0ff';
            let grad = ctx.createRadialGradient(p.x, p.y, 1, p.x, p.y, (p.radius || 7) * p.scale);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(1, p.color || '#00f0ff');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(p.x, p.y, (p.radius || 7) * p.scale, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            if (p.x > cameraX + 1000 || p.y < -50 || p.y > GROUND_Y + 50) { projectiles.splice(i, 1); continue; }

            let hitObstacle = false;
            for (let j = obstacles.length - 1; j >= 0; j--) {
                let obs = obstacles[j];
                if (isColliding(p, obs, (p.radius || 7) * p.scale)) {
                    hitObstacle = true;
                    if (obs.hp !== Infinity) {
                        obs.hp -= p.damage;
                        spawnDamageText(obs.x + 25, obs.y, p.damage);
                        if (obs.hp <= 0) {
                            createExplosion(obs.x + obs.width/2, obs.y + obs.height/2, '#ffffff');
                            obstacles.splice(j, 1);
                        }
                    } else {
                        createExplosion(p.x, p.y, '#00f0ff');
                    }
                    break;
                }
            }
            if (hitObstacle) {
                projectiles.splice(i, 1);
                continue;
            }

            let hitFlying = false;
            for (let f = flyingEnemies.length - 1; f >= 0; f--) {
                let fe = flyingEnemies[f];
                if (isColliding(p, fe, (p.radius || 7) * p.scale)) {
                    fe.hp -= p.damage;
                    spawnDamageText(fe.x + 20, fe.y, p.damage);
                    hitFlying = true;
                    if (fe.hp <= 0) {
                        createExplosion(fe.x + fe.width/2, fe.y + fe.height/2, '#ffaa00');
                        addCoins(1);
                        flyingEnemies.splice(f, 1);
                    }
                    if (p.damage < 3) projectiles.splice(i, 1);
                    break;
                }
            }
            if (hitFlying) continue;

            let hitAnyEnemy = false;
            for (let k = enemies.length - 1; k >= 0; k--) {
                let enemy = enemies[k];
                if (isColliding(p, enemy, (p.radius || 7) * p.scale)) {
                    enemy.hp -= p.damage;
                    spawnDamageText(enemy.x + enemy.width/2, enemy.y, p.damage);
                    hitAnyEnemy = true;
                    
                    if (enemy.isBoss || enemy.isMidBoss) {
                        enemy.hitFlashTimer = 6;
                        createExplosion(p.x, p.y, '#ffff00');
                        
                        if (enemy.isBoss) {
                            updateBossHpBar(enemy.hp, enemy.maxHp);
                        }
                    }

                    if (enemy.hp <= 0) {
                        createExplosion(enemy.x + enemy.width/2, enemy.y + enemy.height/2, '#ff0055');
                        
                        if (enemy.isBoss) addCoins(10);
                        else if (enemy.isMidBoss) addCoins(2);
                        else addCoins(1);

                        enemies.splice(k, 1);
                        if (enemy.isBoss) {
                            bossUiContainer.classList.remove('visible');
                            endGame(true);
                        }
                    }
                    if (p.damage < 3) {
                        projectiles.splice(i, 1);
                    }
                    break;
                }
            }
            if (hitAnyEnemy && projectiles[i]) {
                if (!projectiles.includes(p)) continue;
            }
        }

        let now = Date.now();
        for (let i = flyingEnemies.length - 1; i >= 0; i--) {
            let fe = flyingEnemies[i];
            fe.x += fe.dir * 1.5;
            if (Math.abs(fe.x - player.x) > 600) fe.dir *= -1;

            drawFlyingBird(fe, animFrame);

            if (now - fe.lastAttack > 2100) {
                fe.lastAttack = now;
                enemyProjectiles.push({
                    x: fe.x + fe.width / 2,
                    y: fe.y + fe.height,
                    vx: (player.x > fe.x ? 2.5 : -2.5),
                    vy: 3.5,
                    radius: 5,
                    color: '#ffee00'
                });
            }
        }

        // --- 수정 1: 적 미사일과 흰색/검은색 상자(장애물) 충돌 처리 로직 공통 구현 ---
        for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
            let ep = enemyProjectiles[i];
            
            if (ep.isRotating) {
                ep.angle += 0.1;
                ep.x += ep.vx;
                ep.y += ep.vy + Math.sin(ep.angle) * 1.5;
            } else {
                ep.x += ep.vx;
                ep.y += ep.vy;
            }

            // 장애물(흰색 상자, 검은 상자)과 적 미사일 충돌 검사
            let hitObstacleByEnemyProj = false;
            for (let obs of obstacles) {
                if (isColliding(ep, obs, ep.radius)) {
                    hitObstacleByEnemyProj = true;
                    createExplosion(ep.x, ep.y, obs.type === 'black' ? '#00f0ff' : '#ffffff');
                    break;
                }
            }

            if (hitObstacleByEnemyProj) {
                enemyProjectiles.splice(i, 1);
                continue;
            }

            let collidedWithPlayerProj = false;
            for (let j = projectiles.length - 1; j >= 0; j--) {
                let p = projectiles[j];
                let dist = Math.hypot(ep.x - p.x, ep.y - p.y);
                if (dist < ep.radius + (p.radius || 7) * p.scale) {
                    projectiles.splice(j, 1);
                    collidedWithPlayerProj = true;
                    break;
                }
            }
            if (collidedWithPlayerProj) {
                createExplosion(ep.x, ep.y, '#00f0ff');
                enemyProjectiles.splice(i, 1);
                continue;
            }

            ctx.save();
            ctx.shadowBlur = 12;
            ctx.shadowColor = ep.color;
            ctx.fillStyle = ep.color;
            ctx.beginPath();
            ctx.arc(ep.x, ep.y, ep.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            if (isColliding({x: player.x + 14, y: player.y + 30}, {x: ep.x - ep.radius, y: ep.y - ep.radius, width: ep.radius*2, height: ep.radius*2}, ep.radius)) {
                takeDamage();
                enemyProjectiles.splice(i, 1);
                continue;
            }

            if (ep.x < cameraX - 50 || ep.x > cameraX + 1050 || ep.y > GROUND_Y + 20) {
                enemyProjectiles.splice(i, 1);
            }
        }

        for (let i = explosions.length - 1; i >= 0; i--) {
            let ex = explosions[i];
            ex.radius += 2.5;
            ex.alpha -= 0.05;
            if (ex.alpha <= 0) {
                explosions.splice(i, 1);
                continue;
            }
            ctx.save();
            ctx.globalAlpha = ex.alpha;
            ctx.fillStyle = ex.color;
            ctx.beginPath();
            ctx.arc(ex.x, ex.y, ex.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        for (let obs of obstacles) {
            drawPseudo3DBox(obs);
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];

            if (e.isBoss) {
                bossUiContainer.classList.add('visible');
                drawMechaBoss(e, animFrame);
                if (now - e.lastAttack > 840) {
                    e.lastAttack = now;
                    e.patternCount = (e.patternCount || 0) + 1;

                    if (e.patternCount % 2 === 0) {
                        enemyProjectiles.push({ x: e.x + 10, y: e.y + 50, vx: -6, vy: -1.2, radius: 7, color: '#ff0055' });
                        enemyProjectiles.push({ x: e.x + 10, y: e.y + 70, vx: -6, vy: 0, radius: 8, color: '#ff0055' });
                        enemyProjectiles.push({ x: e.x + 10, y: e.y + 90, vx: -6, vy: 1.2, radius: 7, color: '#ff0055' });
                    } else {
                        enemyProjectiles.push({ x: e.x + 10, y: e.y + 60, vx: -8, vy: 0, radius: 10, color: '#00f0ff' });
                    }
                }
            } else if (e.isMidBoss) {
                drawMidBoss(e, animFrame);
                if (now - e.lastAttack > 1500) {
                    e.lastAttack = now;
                    enemyProjectiles.push({ 
                        x: e.x, 
                        y: e.y + 30, 
                        vx: -4, 
                        vy: 0, 
                        radius: 7, 
                        color: '#00ff88',
                        isRotating: true,
                        angle: 0
                    });
                }
            } else {
                drawMinionMonster(e, animFrame);
                
                let distanceToPlayer = Math.abs(player.x - e.x);
                if (distanceToPlayer < 750 && now - e.lastAttack > 1960) {
                    e.lastAttack = now;
                    enemyProjectiles.push({ 
                        x: e.x, 
                        y: GROUND_Y - 45, 
                        vx: (player.x > e.x ? 4.5 : -4.5), 
                        vy: 0, 
                        radius: 6, 
                        color: '#ff5500' 
                    });
                }
            }

            if (isBoxColliding(player, e)) {
                takeDamage();
            }
        }

        updateAndDrawFloatingTexts();

        ctx.restore();
        requestAnimationFrame(update);
    }

    function updateBossHpBar(currentHp, maxHp) {
        let percent = Math.max(0, (currentHp / maxHp) * 100);
        bossHpBar.style.width = percent + '%';
        bossHpText.innerText = `${Math.ceil(currentHp)} / ${maxHp}`;

        if (currentHp >= 60) {
            bossHpBar.style.backgroundColor = 'var(--neon-green)';
            bossHpBar.style.boxShadow = '0 0 10px var(--neon-green)';
        } else if (currentHp >= 40) {
            bossHpBar.style.backgroundColor = 'var(--neon-yellow)';
            bossHpBar.style.boxShadow = '0 0 10px var(--neon-yellow)';
        } else {
            bossHpBar.style.backgroundColor = 'var(--neon-pink)';
            bossHpBar.style.boxShadow = '0 0 10px var(--neon-pink)';
        }
    }

    function createExplosion(x, y, color) {
        explosions.push({ x: x, y: y, radius: 5, alpha: 1.0, color: color });
    }

    function drawSpaceBackground() {
        ctx.fillStyle = '#ffffff';
        stars.forEach(s => {
            let renderX = (s.x - cameraX * s.speed) % 6500;
            if (renderX < 0) renderX += 6500;
            ctx.beginPath();
            ctx.arc(renderX, s.y, s.size, 0, Math.PI * 2);
            ctx.fill();
        });

        ctx.save();
        let groundGrad = ctx.createLinearGradient(0, GROUND_Y, 0, 440);
        groundGrad.addColorStop(0, '#0c1222');
        groundGrad.addColorStop(1, '#03050a');
        ctx.fillStyle = groundGrad;
        ctx.fillRect(cameraX, GROUND_Y, 920, 120);

        ctx.strokeStyle = '#00f0ff';
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#00f0ff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cameraX, GROUND_Y);
        ctx.lineTo(cameraX + 920, GROUND_Y);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(0, 240, 255, 0.15)';
        ctx.lineWidth = 1;
        for (let x = Math.floor(cameraX / 40) * 40; x < cameraX + 920; x += 40) {
            ctx.beginPath();
            ctx.moveTo(x, GROUND_Y);
            ctx.lineTo(x - 30, 440);
            ctx.stroke();
        }
        ctx.restore();
    }

    // 캐릭터 조합 데이터(외형, 무기, 장식)를 반영하여 렌더링하도록 개선
    function drawHero(x, y, isCrouch, isAimup, isAttacking, frame, character) {
        ctx.save();
        
        let legSwing = Math.sin(frame * 0.25) * 12;
        let armSwing = Math.cos(frame * 0.25) * 12;
        let headY = isCrouch ? y + 25 : y + 10;
        let bodyY = headY + 12;
        let hipY = isCrouch ? y + 42 : y + 42;

        ctx.fillStyle = 'rgba(0, 240, 255, 0.25)';
        ctx.beginPath();
        ctx.ellipse(x + 14, y + 60, 14, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        // 날개 또는 액세서리 렌더링
        if (character.accessory.includes('날개') || character.isRainbow) {
            ctx.save();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x + 14, bodyY);
            ctx.quadraticCurveTo(x - 15, bodyY - 15, x - 25, bodyY + 5);
            ctx.quadraticCurveTo(x - 12, bodyY + 10, x + 14, bodyY + 10);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = 'rgba(255, 0, 85, 0.85)';
            ctx.strokeStyle = '#ff0055';
            ctx.beginPath();
            ctx.moveTo(x + 14, bodyY);
            ctx.quadraticCurveTo(x + 35, bodyY - 20, x + 45, bodyY + 2);
            ctx.quadraticCurveTo(x + 30, bodyY + 12, x + 14, bodyY + 10);
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }

        ctx.shadowBlur = 12;
        let mainColor = character.colorHex === 'rainbow' ? '#ff00ff' : (character.colorHex || '#00f0ff');
        ctx.strokeStyle = mainColor;
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        let headGrad = ctx.createRadialGradient(x + 12, headY - 2, 2, x + 14, headY, 10);
        headGrad.addColorStop(0, '#ffffff');
        headGrad.addColorStop(0.4, mainColor);
        headGrad.addColorStop(1, '#111');
        ctx.fillStyle = headGrad;
        ctx.beginPath();
        ctx.arc(x + 14, headY, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(x + 17, headY - 2, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(x + 14, bodyY);
        ctx.lineTo(x + 14, hipY);
        ctx.stroke();

        ctx.fillStyle = mainColor;
        ctx.beginPath();
        ctx.arc(x + 14, bodyY + 6, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        if (isAttacking) {
            ctx.moveTo(x + 14, bodyY + 4);
            if (isAimup) {
                ctx.lineTo(x + 14, bodyY - 18);
            } else {
                ctx.lineTo(x + 34, bodyY + 2);
            }
            ctx.stroke();
        } else {
            ctx.moveTo(x + 14, bodyY + 4);
            ctx.lineTo(x + 14 + armSwing, bodyY + 18);
            ctx.moveTo(x + 14, bodyY + 4);
            ctx.lineTo(x + 14 - armSwing, bodyY + 18);
            ctx.stroke();
        }

        ctx.beginPath();
        if (isCrouch) {
            ctx.moveTo(x + 14, hipY);
            ctx.lineTo(x + 2, hipY + 16);
            ctx.moveTo(x + 14, hipY);
            ctx.lineTo(x + 26, hipY + 16);
        } else {
            ctx.moveTo(x + 14, hipY);
            ctx.lineTo(x + 14 + legSwing, y + 60);
            ctx.moveTo(x + 14, hipY);
            ctx.lineTo(x + 14 - legSwing, y + 60);
        }
        ctx.stroke();

        ctx.restore();
    }

    function drawMinionMonster(e, frame) {
        ctx.save();
        let bodyGrad = ctx.createRadialGradient(e.x + 24, e.y + 26, 6, e.x + 24, e.y + 26, 28);
        bodyGrad.addColorStop(0, '#ff5500');
        bodyGrad.addColorStop(1, '#aa0033');

        ctx.fillStyle = bodyGrad;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff0055';

        ctx.beginPath();
        ctx.ellipse(e.x + 24, e.y + 26, 22, 24 + Math.sin(frame * 0.2) * 2, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(e.x + 15, e.y + 20, 6, 0, Math.PI * 2);
        ctx.arc(e.x + 33, e.y + 20, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(e.x + 13, e.y + 20, 2.5, 0, Math.PI * 2);
        ctx.arc(e.x + 31, e.y + 20, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    function drawMidBoss(e, frame) {
        ctx.save();
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00ff88';

        ctx.fillStyle = e.hitFlashTimer > 0 ? '#ffffff' : '#00aa55';
        if (e.hitFlashTimer > 0) e.hitFlashTimer--;

        ctx.fillRect(e.x, e.y, e.width, e.height);
        ctx.strokeStyle = '#00ff88';
        ctx.lineWidth = 2;
        ctx.strokeRect(e.x, e.y, e.width, e.height);

        ctx.fillStyle = '#00ff88';
        ctx.fillRect(e.x - 10, e.y + 20, 10, 30);
        ctx.fillRect(e.x + e.width, e.y + 20, 10, 30);

        ctx.fillStyle = '#ffff00';
        ctx.fillRect(e.x + 12, e.y + 15, 12, 10);
        ctx.fillRect(e.x + 38, e.y + 15, 12, 10);

        ctx.restore();
    }

    function drawFlyingBird(fe, frame) {
        ctx.save();
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ffee00';
        ctx.fillStyle = '#ffaa00';
        ctx.strokeStyle = '#ffee00';
        ctx.lineWidth = 2;

        let wingOffset = Math.sin(frame * 0.4) * 12;

        ctx.beginPath();
        ctx.ellipse(fe.x + 20, fe.y + 15, 18, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(fe.x + 15, fe.y + 10);
        ctx.lineTo(fe.x + 20, fe.y - 5 + wingOffset);
        ctx.lineTo(fe.x + 25, fe.y + 10);
        ctx.fillStyle = '#ff5500';
        ctx.fill();
        ctx.stroke();

        ctx.restore();
    }

    function drawMechaBoss(e, frame) {
        ctx.save();
        ctx.shadowBlur = 25;
        ctx.shadowColor = '#ff0055';

        let isFlashing = e.hitFlashTimer > 0;
        if (e.hitFlashTimer > 0) e.hitFlashTimer--;

        ctx.fillStyle = isFlashing ? '#ffffff' : '#1f1124';
        ctx.strokeStyle = isFlashing ? '#ffffff' : '#ff0055';
        ctx.lineWidth = 4;

        ctx.fillRect(e.x, e.y, e.width, e.height);
        ctx.strokeRect(e.x, e.y, e.width, e.height);

        ctx.fillStyle = isFlashing ? '#ffffff' : '#3d1a45';
        ctx.fillRect(e.x - 25, e.y + 40, 25, 80);
        ctx.fillRect(e.x + e.width, e.y + 40, 25, 80);
        ctx.strokeRect(e.x - 25, e.y + 40, 25, 80);
        ctx.strokeRect(e.x + e.width, e.y + 40, 25, 80);

        ctx.fillRect(e.x + 20, e.y + e.height, 35, 30);
        ctx.fillRect(e.x + e.width - 55, e.y + e.height, 35, 30);

        ctx.fillStyle = '#00f0ff';
        ctx.fillRect(e.x + 25, e.y + 25, 30, 20);
        ctx.fillRect(e.x + e.width - 55, e.y + 25, 30, 20);

        ctx.fillStyle = '#ff0055';
        ctx.fillRect(e.x + 10, e.y + 70, 40, 15);

        ctx.restore();
    }

    function drawPseudo3DBox(obs) {
        ctx.save();
        const isBlack = obs.type === 'black';

        let mainGrad = ctx.createLinearGradient(obs.x, obs.y, obs.x, obs.y + obs.height);
        if (isBlack) {
            mainGrad.addColorStop(0, '#2a2e3d');
            mainGrad.addColorStop(1, '#0e1017');
        } else {
            mainGrad.addColorStop(0, '#ffffff');
            mainGrad.addColorStop(1, '#b0c4de');
        }
        ctx.fillStyle = mainGrad;
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

        ctx.fillStyle = isBlack ? '#3d4357' : '#e6f0fa';
        ctx.beginPath();
        ctx.moveTo(obs.x, obs.y);
        ctx.lineTo(obs.x + 8, obs.y - 8);
        ctx.lineTo(obs.x + obs.width + 8, obs.y - 8);
        ctx.lineTo(obs.x + obs.width, obs.y);
        ctx.fill();

        ctx.fillStyle = isBlack ? '#171a24' : '#889ebb';
        ctx.beginPath();
        ctx.moveTo(obs.x + obs.width, obs.y);
        ctx.lineTo(obs.x + obs.width + 8, obs.y - 8);
        ctx.lineTo(obs.x + obs.width + 8, obs.y + obs.height - 8);
        ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
        ctx.fill();

        ctx.strokeStyle = isBlack ? '#00f0ff' : '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);

        ctx.restore();
    }

    function takeDamage() {
        player.hitsTaken += 1;
        let remainingHits = Math.max(0, player.maxHits - player.hitsTaken);
        hpText.innerText = `${remainingHits} / 20`;

        let percent = (remainingHits / player.maxHits) * 100;
        hpBar.style.width = percent + '%';

        if (player.hitsTaken >= player.maxHits) {
            endGame(false);
        }
    }

    function isColliding(circle, rect, radius) {
        return circle.x + radius > rect.x &&
               circle.x - radius < rect.x + rect.width &&
               circle.y + radius > rect.y &&
               circle.y - radius < rect.y + rect.height;
    }

    function isBoxColliding(r1, r2) {
        return !(r2.x > r1.x + r1.width ||
                 r2.x + r2.width < r1.x ||
                 r2.y > r1.y + r1.height ||
                 r2.y + r2.height < r1.y);
    }

    const movePad = document.getElementById('btn-move-pad');
    if (movePad) {
        function handleJoystick(clientX, clientY) {
            let rect = movePad.getBoundingClientRect();
            let centerX = rect.left + rect.width / 2;
            let centerY = rect.top + rect.height / 2;
            let dx = clientX - centerX;
            let dy = clientY - centerY;
            let distance = Math.hypot(dx, dy);
            let maxRadius = 25;

            if (distance > maxRadius) {
                dx = (dx / distance) * maxRadius;
                dy = (dy / distance) * maxRadius;
            }

            joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

            keys.left = dx < -10;
            keys.right = dx > 10;
            player.isCrouching = dy > 14;
            player.isAimingUp = dy < -14;

            if (dy < -12 && player.isGrounded && gameStarted && !isGameOver) {
                player.vy = -11.05;
                player.isGrounded = false;
            }
        }

        movePad.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            try { movePad.setPointerCapture(e.pointerId); } catch(err) {}
            handleJoystick(e.clientX, e.clientY);
        });
        movePad.addEventListener('pointermove', (e) => {
            if (e.buttons === 1) {
                handleJoystick(e.clientX, e.clientY);
            }
        });
        movePad.addEventListener('pointerup', (e) => {
            if (e) e.preventDefault();
            joystickKnob.style.transform = `translate(-50%, -50%)`;
            keys.left = false;
            keys.right = false;
            player.isCrouching = false;
            player.isAimingUp = false;
        });
    }

    const attackBtn = document.getElementById('btn-attack');
    if (attackBtn) {
        attackBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (!gameStarted || isGameOver) return;
            attackStartTime = Date.now();
            attackBtn.classList.add('charging');

            fireProjectile(1 * damageMultiplier, scaleMultiplier, 7 * scaleMultiplier, activeCharacter.isRainbow ? '#ff00ff' : '#00f0ff');

            if (continuousFireTimer) clearInterval(continuousFireTimer);
            continuousFireTimer = setInterval(() => {
                fireProjectile(1 * damageMultiplier, scaleMultiplier, 7 * scaleMultiplier, activeCharacter.isRainbow ? '#ff00ff' : '#00f0ff');
            }, 300);

            if (attackHoldTimer) clearInterval(attackHoldTimer);
            attackHoldTimer = setInterval(() => {
                let holdSec = ((Date.now() - attackStartTime) / 1000).toFixed(1);
                chargeText.innerText = `CHARGE ${holdSec}s`;
            }, 100);
        });

        attackBtn.addEventListener('pointerup', (e) => {
            e.preventDefault();
            if (!gameStarted || isGameOver) return;
            clearInterval(attackHoldTimer);
            clearInterval(continuousFireTimer);
            attackBtn.classList.remove('charging');
            chargeText.innerText = '';

            let holdTime = (Date.now() - attackStartTime) / 1000;
            
            if (holdTime >= 10) {
                fireProjectile(12 * damageMultiplier, scaleMultiplier * 1.5, 22 * scaleMultiplier, '#ff00ff');
            } else if (holdTime >= 5) {
                fireProjectile(6 * damageMultiplier, scaleMultiplier * 1.3, 16 * scaleMultiplier, '#ffaa00');
            } else if (holdTime >= 3) {
                fireProjectile(3 * damageMultiplier, scaleMultiplier * 1.1, 11 * scaleMultiplier, '#00ff88');
            }
        });
    }

    function fireProjectile(damage, scale, radius, color) {
        player.isAttacking = true;
        player.attackAnimTimer = 15;

        let vx = player.isAimingUp ? 0 : (damage > 3 ? 11 : 9);
        let vy = player.isAimingUp ? (damage > 3 ? -11 : -9) : 0;
        let startX = player.isAimingUp ? player.x + 14 : player.x + 28;
        let startY = player.isAimingUp ? player.y + 10 : (player.isCrouching ? player.y + 25 : player.y + 15);

        projectiles.push({
            x: startX,
            y: startY,
            vx: vx,
            vy: vy,
            damage: damage,
            scale: scale,
            radius: radius,
            color: color
        });
    }

    window.addEventListener('keydown', (e) => {
        if (!gameStarted) return;
        if (e.key === 'ArrowLeft') keys.left = true;
        if (e.key === 'ArrowRight') keys.right = true;
        if (e.key === 'ArrowDown') player.isCrouching = true;
        if (e.key === 'ArrowUp') player.isAimingUp = true;
        if ((e.key === ' ' || e.key === 'ArrowUp') && player.isGrounded && e.key !== 'ArrowUp') {
            player.vy = -11.05;
            player.isGrounded = false;
        }
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft') keys.left = false;
        if (e.key === 'ArrowRight') keys.right = false;
        if (e.key === 'ArrowDown') player.isCrouching = false;
        if (e.key === 'ArrowUp') player.isAimingUp = false;
    });

    function endGame(isWin) {
        isGameOver = true;
        if (gameOverScreen) gameOverScreen.style.display = 'flex';
        if (gameMsg) {
            gameMsg.innerText = isWin ? '축하합니다. 1단계 완료' : 'GAME OVER';
            gameMsg.style.color = isWin ? '#00ff88' : '#ff0055';
        }
        if (gameSub) {
            if (isWin) {
                gameSub.innerText = '2편은 곧 업데이트 됩니다!';
                gameSub.style.display = 'block';
            } else {
                gameSub.style.display = 'none';
            }
        }
    }

    window.resetGame = function() {
        location.reload();
    };
});
</script>
